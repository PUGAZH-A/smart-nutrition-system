
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <title>Admin Panel - Smart Nutrition</title>
    <link rel="stylesheet" href="style.css">
</head>

<section class="admin-section">
    <h2>👥 User Management</h2>

    <p>Total Registered Users: <strong id="totalUsers">0</strong></p>

    <div style="overflow-x:auto;">
        <table border="1" cellpadding="10"
            cellspacing="0" width="100%">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Age</th>
                    <th>Locality</th>
                    <th>Food Preference</th>
                </tr>
            </thead>
            <tbody id="userManagementTable"></tbody>
        </table>
    </div>
    


</section>



<script>
function loadAdminManagement() {
    const users = JSON.parse(
        localStorage.getItem("users") || "[]"
    );

    document.getElementById("totalUsers").textContent =
        users.length;

    const table = document.getElementById("userManagementTable");
    table.replaceChildren();

    users.forEach(user => {
        const row = document.createElement("tr");

        [user.name, user.email, user.age,
         user.locality, user.foodPreference].forEach(value => {
            const cell = document.createElement("td");
            cell.textContent = value || "-";
            row.appendChild(cell);
        });

        table.appendChild(row);
    });

    displayContactMessages();
}

function displayContactMessages() {
    const messages = JSON.parse(
        localStorage.getItem("contactMessages") || "[]"
    );

    document.getElementById("totalMessages").textContent =
        messages.length;

    const container =
        document.getElementById("contactMessagesList");

    container.replaceChildren();

    if (messages.length === 0) {
        container.textContent = "No messages found.";
        return;
    }

    messages.forEach((message, index) => {
        const card = document.createElement("div");
        card.className = "message-card";

        const name = document.createElement("h3");
        name.textContent = message.name;

        const email = document.createElement("p");
        email.textContent = "Email: " + message.email;

        const subject = document.createElement("p");
        subject.textContent = "Subject: " + message.subject;

        const content = document.createElement("p");
        content.textContent = "Message: " + message.message;

        const deleteButton = document.createElement("button");
        deleteButton.textContent = "Delete Message";
        deleteButton.className = "delete-message";

        deleteButton.onclick = function() {
            deleteContactMessage(index);
        };

        card.append(name, email, subject, content, deleteButton);
        container.appendChild(card);
    });
}

function deleteContactMessage(index) {
    const messages = JSON.parse(
        localStorage.getItem("contactMessages") || "[]"
    );

    messages.splice(index, 1);

    localStorage.setItem(
        "contactMessages",
        JSON.stringify(messages)
    );

    displayContactMessages();
}

loadAdminManagement();
</script><body>

<header>
    <h2>🥗 Smart Nutrition Admin</h2>
    <a href="index.html" style="color:white">Home</a>
</header>

<section class="page">
    <h1>Admin Dashboard</h1>

    <div class="card">
        <h2>Registered Users</h2>
        <h1 id="userCount">0</h1>
    </div>

    <h2>Add New Food</h2>

    <form id="foodForm">
        <input id="foodName" placeholder="Food Name" required>

        <select id="foodCategory">
            <option value="Vegetarian">Vegetarian</option>
            <option value="Non-Vegetarian">Non-Vegetarian</option>
        </select>

        <input id="foodDescription"
        placeholder="Food Description" required>

        <button type="submit">Add Food</button>
    </form>

    <h2>Food Management</h2>
    <div id="adminFoodList"></div>

    <h2>Registered Users</h2>
    <div id="adminUserList"></div>
</section>

<script>
const ADMIN_USER = "admin";
const ADMIN_PASSWORD = "admin123";

if (sessionStorage.getItem("adminLoggedIn") !== "yes") {
    const username = prompt("Admin Username:");
    const password = prompt("Admin Password:");

    if (username !== ADMIN_USER || password !== ADMIN_PASSWORD) {
        alert("Invalid Admin Login");
        window.location.href = "index.html";
    } else {
        sessionStorage.setItem("adminLoggedIn", "yes");
    }
}

function getFoods() {
    return JSON.parse(localStorage.getItem("foods")) || [];
}

function displayAdminData() {
    const users = JSON.parse(localStorage.getItem("users")) || [];
    const foods = getFoods();

    document.getElementById("userCount").innerText = users.length;

    document.getElementById("adminUserList").innerHTML =
        users.map(u => `<p>${u.name} - ${u.email}</p>`).join("");

    document.getElementById("adminFoodList").innerHTML =
        foods.map((f, i) => `
            <div class="card">
                <h3>${f.name}</h3>
                <p>${f.category}</p>
                <p>${f.description}</p>
                <button onclick="deleteFood(${i})">Delete</button>
            </div>
        `).join("");
}

document.getElementById("foodForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const foods = getFoods();

    foods.push({
        name: document.getElementById("foodName").value,
        category: document.getElementById("foodCategory").value,
        description: document.getElementById("foodDescription").value
    });

    localStorage.setItem("foods", JSON.stringify(foods));

    this.reset();
    displayAdminData();
});

function deleteFood(index) {
    const foods = getFoods();
    foods.splice(index, 1);

    localStorage.setItem("foods", JSON.stringify(foods));
    displayAdminData();
}

displayAdminData();
</script>

</body>
</html>
