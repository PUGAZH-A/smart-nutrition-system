<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Smart Nutrition System</title>
    <link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="site-header">
        <a class="brand" href="index.html">🥗 Smart Nutrition</a>
        <nav class="site-nav">
            <a href="index.html">Home</a>
            <a href="food.html">Foods</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main class="info-page">
        <section class="info-hero">
            <p class="eyebrow">GET IN TOUCH</p>
            <h1>Contact Us</h1>
            <p>Have a question or suggestion about our project? Send us a message.</p>
        </section>

        <section class="info-card contact-card">
            <form id="contactForm">
                <label for="contactName">Your Name</label>
                <input type="text" id="contactName" required placeholder="Enter your name">

                <label for="contactEmail">Email Address</label>
                <input type="email" id="contactEmail" required placeholder="Enter your email">

                <label for="contactMessage">Your Message</label>
                <textarea id="contactMessage" rows="5" required
                    placeholder="Write your message"></textarea>

                <button type="submit">Send Message</button>
                <p id="contactStatus" role="status"></p>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <p>© 2026 Smart Nutrition System | Student Project</p>
    </footer>

    <script>
        document.getElementById("contactForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const message = {
                name: document.getElementById("contactName").value.trim(),
                email: document.getElementById("contactEmail").value.trim(),
                message: document.getElementById("contactMessage").value.trim(),
                date: new Date().toLocaleString()
            };

            const messages = JSON.parse(localStorage.getItem("contactMessages") || "[]");
            messages.push(message);
            localStorage.setItem("contactMessages", JSON.stringify(messages));

            document.getElementById("contactStatus").textContent =
                "Your message has been saved in this browser.";
            this.reset();
        });
    </script>

</body>
</html>
