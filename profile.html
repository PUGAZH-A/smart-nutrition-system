
<!DOCTYPE html>
<html lang="en">
<head>
    <title>My Profile - Smart Nutrition</title>
    <link rel="stylesheet" href="style.css">

<link rel="stylesheet" href="style.css"></head>

<body>

<header>
    <h2>🥗 Smart Nutrition</h2>
    <a href="index.html" style="color:white">Dashboard</a>
</header>

<section class="page">
    <h1>My Profile</h1>

    <form id="profileForm">
        <input id="profileName" placeholder="Full Name" required>
        <input id="profileEmail" type="email" disabled>
        <input id="profileAge" type="number" placeholder="Age" required>
        <input id="profileLocality" placeholder="Locality" required>

        <select id="profileFood">
            <option value="Vegetarian">Vegetarian</option>
            <option value="Non-Vegetarian">Non-Vegetarian</option>
            <option value="Both">Both</option>
        </select>

        <button type="submit">Update Profile</button>
    </form>

    <p id="profileMessage"></p>
</section>

<script>
const email = sessionStorage.getItem("loggedInUser");
const users = JSON.parse(localStorage.getItem("users")) || [];

const user = users.find(u => u.email === email);

if (!user) {
    alert("Please login first");
    window.location.href = "index.html";
} else {
    profileName.value = user.name;
    profileEmail.value = user.email;
    profileAge.value = user.age;
    profileLocality.value = user.locality;
    profileFood.value = user.food;
}

profileForm.addEventListener("submit", function(e) {
    e.preventDefault();

    const index = users.findIndex(u => u.email === email);

    users[index].name = profileName.value;
    users[index].age = profileAge.value;
    users[index].locality = profileLocality.value;
    users[index].food = profileFood.value;

    localStorage.setItem("users", JSON.stringify(users));

    document.getElementById("profileMessage").innerText =
        "Profile Updated Successfully!";
});
</script>

</body>
</html>
